name: Refresh RUC YOJ traffic stats

on:
  schedule:
    # GitHub interprets cron in UTC.  Two off-peak checkpoints per hour make
    # a delayed or dropped scheduled event less likely to leave stale data.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-traffic
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Refresh traffic snapshot
        run: python3 tools/build_traffic.py
      - name: Validate traffic snapshot invariants
        run: python3 tools/build_traffic.py --check
      - name: Commit traffic snapshot
        run: |
          if git diff --quiet -- docs/data/traffic.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data/traffic.json
          git commit -m "chore: refresh Pages traffic stats"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify deployed traffic snapshot
        env:
          DEPLOYED_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 tools/verify_traffic_deploy.py --url "$DEPLOYED_PAGE_URL" --expected docs/data/traffic.json
