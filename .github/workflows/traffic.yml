name: Refresh RUC YOJ traffic stats

on:
  schedule:
    # 00:25 Asia/Shanghai.  The date-scoped counters are then ready for the
    # previous day while the current day starts accumulating immediately.
    - cron: "25 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-traffic
  cancel-in-progress: true

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Refresh traffic snapshot
        run: python3 tools/build_traffic.py
      - name: Commit traffic snapshot
        run: |
          if git diff --quiet -- docs/data/traffic.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data/traffic.json
          git commit -m "chore: refresh Pages traffic stats"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
