name: Deploy RUC YOJ learning site and quick-submit helper

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "data/problems.json"
      - "data/quick-submit.json"
      - "data/public-ready.json"
      - "tools/build_site_catalog.py"
      - "tools/build_initial.py"
      - "tools/audit_consistency.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Generate Pages data
        run: python3 tools/build_site_catalog.py
      - name: Audit public release evidence
        run: python3 tools/audit_consistency.py
      - name: Verify generated Pages data
        run: python3 tools/build_site_catalog.py --check
      - name: Commit synchronized Pages data
        run: |
          if git diff --quiet -- docs/data/catalog.json docs/data/quick-submit.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data/catalog.json docs/data/quick-submit.json
          git commit -m "chore: synchronize Pages data"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
