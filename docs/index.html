<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RUC YOJ 题解归档与快捷提交入口">
  <title>RUC YOJ · 题解与快捷提交</title>
  <style>
    :root{color-scheme:light;--bg:#f4f7fb;--card:rgba(255,255,255,.88);--ink:#14213d;--muted:#64748b;--line:#dce5f2;--accent:#315efb;--accent-dark:#2147c6;--shadow:0 20px 60px rgba(34,67,125,.14)}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0d1424;--card:rgba(24,32,51,.9);--ink:#eef3ff;--muted:#a6b2c9;--line:#303c55;--accent:#7290ff;--accent-dark:#91a7ff;--shadow:0 20px 60px rgba(0,0,0,.24)}}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 8% 0%,rgba(49,94,251,.18),transparent 30rem),radial-gradient(circle at 100% 12%,rgba(76,201,240,.16),transparent 28rem),var(--bg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}a{color:inherit}.wrap{width:min(1120px,calc(100% - 32px));margin:0 auto}header{padding:72px 0 34px}.eyebrow{color:var(--accent);font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{max-width:760px;margin:12px 0 16px;font-size:clamp(36px,7vw,72px);line-height:1.05;letter-spacing:-.055em}.lead{max-width:700px;margin:0;color:var(--muted);font-size:clamp(17px,2.4vw,21px)}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 17px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:var(--card);font-weight:750;text-decoration:none;box-shadow:0 8px 24px rgba(34,67,125,.07)}.button.primary{border-color:transparent;color:#fff;background:var(--accent)}.button:hover{transform:translateY(-1px);border-color:var(--accent)}.button.primary:hover{background:var(--accent-dark)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0 30px}.stat,.panel{border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:var(--shadow);backdrop-filter:blur(12px)}.stat{padding:20px}.stat strong{display:block;font-size:30px;line-height:1.1}.stat span{color:var(--muted);font-size:14px}.panel{padding:24px;margin:18px 0}.panel-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px;margin-bottom:18px}h2{margin:0;font-size:24px;letter-spacing:-.025em}.hint{margin:4px 0 0;color:var(--muted);font-size:14px}input{width:min(330px,100%);min-height:42px;padding:9px 13px;border:1px solid var(--line);border-radius:11px;outline:0;color:var(--ink);background:var(--bg);font:inherit}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(49,94,251,.14)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}.problem{display:flex;min-height:142px;flex-direction:column;justify-content:space-between;gap:14px;padding:16px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.34)}@media(prefers-color-scheme:dark){.problem{background:rgba(255,255,255,.025)}}.problem:hover{border-color:var(--accent)}.number{color:var(--accent);font:750 13px ui-monospace,SFMono-Regular,Menlo,monospace}.problem h3{overflow:hidden;margin:4px 0 0;font-size:17px;text-overflow:ellipsis;white-space:nowrap}.problem-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}.problem-foot a{color:var(--accent);font-weight:750;text-decoration:none}.empty{padding:28px 0 10px;color:var(--muted);text-align:center}footer{padding:12px 0 50px;color:var(--muted);font-size:13px}@media(max-width:640px){header{padding-top:48px}.stats{grid-template-columns:1fr}.panel{padding:18px}}
  </style>
</head>
<body>
  <header class="wrap">
    <div class="eyebrow">RUC · YOJ ARCHIVE</div>
    <h1>从题面到提交，<br>把查找变成一步。</h1>
    <p class="lead">RUC YOJ 题面、原始 AC 代码和快捷提交入口的公开索引。先在 YOJ 登录，再选择题目；页面不会保存账号、密码或 Cookie。</p>
    <div class="actions"><a class="button primary" href="./yoj-quick-submit.html?pno=1">打开题目 1 快捷提交</a><a class="button" href="https://github.com/Scorpascal/RUC_YOJ/blob/main/README.md">浏览完整 README</a></div>
  </header>
  <main class="wrap">
    <section class="stats" aria-label="归档统计"><div class="stat"><strong id="count">—</strong><span>可快捷提交题目</span></div><div class="stat"><strong id="languages">—</strong><span>YOJ 语言</span></div><div class="stat"><strong>公开</strong><span>代码与题面索引</span></div></section>
    <section class="panel"><div class="panel-head"><div><h2>快捷提交题目</h2><p class="hint">搜索题号或题目名称；按钮只打开对应题目的快捷提交页。</p></div><input id="search" type="search" placeholder="搜索题号或题目名称" aria-label="搜索题目"></div><div id="list" class="grid" aria-live="polite"></div><p id="empty" class="empty" hidden>没有匹配的题目。</p></section>
  </main>
  <footer class="wrap">代码状态和在线结果以仓库 README 与 YOJ 页面为准；页面由 GitHub Pages 自动发布。</footer>
  <script>
    (()=>{
      "use strict";
      const list=document.getElementById("list"),empty=document.getElementById("empty"),search=document.getElementById("search"),count=document.getElementById("count"),languages=document.getElementById("languages");
      let entries=[];
      function render(){
        const query=search.value.trim().toLowerCase();
        const shown=entries.filter(item=>String(item.problemNo).includes(query)||String(item.title).toLowerCase().includes(query));
        list.replaceChildren();
        shown.forEach(item=>{
          const card=document.createElement("article");
          card.className="problem";
          card.innerHTML='<div><div class="number"></div><h3></h3></div><div class="problem-foot"><span></span><a>快捷提交 →</a></div>';
          card.querySelector(".number").textContent="YOJ "+String(item.problemNo).padStart(4,"0");
          card.querySelector("h3").textContent=item.title;
          card.querySelector("span").textContent=item.language;
          const link=card.querySelector("a");
          link.href="./yoj-quick-submit.html?pno="+encodeURIComponent(item.problemNo);
          list.append(card);
        });
        empty.hidden=shown.length!==0;
      }
      fetch("data/quick-submit.json",{cache:"no-store"}).then(response=>{if(!response.ok)throw new Error("manifest unavailable");return response.json()}).then(manifest=>{entries=Array.isArray(manifest.entries)?manifest.entries:[];count.textContent=entries.length;languages.textContent=new Set(entries.map(item=>item.language)).size;render()}).catch(()=>{count.textContent="—";languages.textContent="—";empty.hidden=false;empty.textContent="公开题目清单暂时无法加载，请稍后重试或直接浏览 README。"});
      search.addEventListener("input",render);
    })();
  </script>
</body>
</html>
